name: Prepare safe SheetJS upgrade on review branch

on:
  push:
    branches: [fix/sheetjs-security-upgrade-20261102]

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh package and lock from official patched SheetJS release
        run: npm install --package-lock-only --save-exact --ignore-scripts "xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
      - name: Clean install from refreshed lock
        run: npm ci --ignore-scripts
      - name: Syntax validation
        run: npm run check
      - name: Regression tests, including CSV/XLSX import
        run: npm test
      - name: Commit reviewed dependency metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "fix(deps): upgrade SheetJS to patched 0.20.3" && git push origin HEAD:refs/heads/fix/sheetjs-security-upgrade-20261102)
